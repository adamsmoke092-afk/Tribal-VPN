name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tribal-vpn
    steps:
      - name: Checkout (hev-socks5-tunnel submodule is cloned here, not on the phone)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: "Fetch pinned Xray engine artifact (libv2ray.aar, tag + sha256)"
        # The Xray engine's Android artifact, pinned exactly like the hev
        # submodule is pinned by commit: release tag v26.10.21 (whose go.mod
        # pins Xray-core v1.260327.1-0.20261021115930-1b1647cd9ddf) plus the
        # sha256 of the asset itself. Downloaded here rather than committed:
        # it is ~57 MB and the dev phone has no storage. A hash mismatch fails
        # the build before Gradle ever sees the file.
        run: |
          set -euo pipefail
          mkdir -p app/libs
          url="https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.21/libv2ray.aar"
          sha="e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4"
          curl -sSL --retry 3 -o app/libs/libv2ray.aar "$url"
          echo "$sha  app/libs/libv2ray.aar" | sha256sum -c -
          ls -l app/libs/libv2ray.aar

      - name: "Gate: ndk-build module-graph dry-runs (release a->b cascade + diagnostic)"
        # Runs BEFORE Gradle, after checkout (it needs the hev submodule
        # sources to parse). Standalone ndk-build dry-runs validate the
        # release bridge policy: a + b + hev present, debug-only c absent,
        # and every norelro line belongs to variant b (a keeps RELRO on).
        # NDK 26.1.10909125 is AGP 8.5.1's default - installing it here
        # also pre-warms Gradle's own auto-install.
        run: |
          NDKBUILD="$(ls -d "$ANDROID_HOME"/ndk/*/ndk-build 2>/dev/null | head -n1 || true)"
          if [ -z "$NDKBUILD" ]; then
            yes | sdkmanager "ndk;26.1.10909125" >/dev/null
            NDKBUILD="$(ls -d "$ANDROID_HOME"/ndk/*/ndk-build | head -n1)"
          fi
          echo "ndk-build: $NDKBUILD"
          cd app/src/main/cpp
          dry() {
            "$NDKBUILD" -n NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
              APP_ABI=arm64-v8a APP_PLATFORM=android-26 "$@"
          }
          dump_and_die() {
            echo "=== Android.mk ==="
            cat Android.mk
            echo "=== dry-run output ($1) ==="
            cat "$1"
            exit 1
          }
          dry NDK_DEBUG=0 > dry_release.txt 2>&1 || dump_and_die dry_release.txt
          if grep -q "tribal_bridge_c" dry_release.txt; then
            echo "FATAL: debug-only variant c exists in the release-parity parse"
            dump_and_die dry_release.txt
          fi
          grep -q "libtribal_bridge_a.so" dry_release.txt || {
            echo "FATAL: variant a missing from the release-parity parse"
            dump_and_die dry_release.txt
          }
          grep -q "libtribal_bridge_b.so" dry_release.txt || {
            echo "FATAL: RELRO fallback variant b missing from the release-parity parse"
            dump_and_die dry_release.txt
          }
          grep -q "libhev-socks5-tunnel.so" dry_release.txt || {
            echo "FATAL: hev-socks5-tunnel module missing (submodule checkout?)"
            dump_and_die dry_release.txt
          }
          echo "=== norelro lines in the release-parity parse ==="
          grep "norelro" dry_release.txt || {
            echo "FATAL: no norelro line - variant b lost its RELRO-disable flag"
            dump_and_die dry_release.txt
          }
          if grep "norelro" dry_release.txt | grep -qv "libtribal_bridge_b.so"; then
            echo "FATAL: a norelro line does not name libtribal_bridge_b.so"
            dump_and_die dry_release.txt
          fi
          dry NDK_DEBUG=0 TRIBAL_DIAG_VARIANTS=1 > dry_debug.txt 2>&1 || dump_and_die dry_debug.txt
          for m in tribal_bridge_a tribal_bridge_b tribal_bridge_c; do
            grep -q "$m" dry_debug.txt || {
              echo "FATAL: $m missing from the diagnostic parse"
              dump_and_die dry_debug.txt
            }
          done
          dry NDK_DEBUG=1 > dry_ndkdebug.txt 2>&1 || dump_and_die dry_ndkdebug.txt
          # armeabi-v7a is the other retained ABI: its release-parity parse
          # must produce the same module set (hev + variants a/b, no c),
          # proving the relay still builds for 32-bit ARM.
          dry_v7a() {
            "$NDKBUILD" -n NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
              APP_ABI=armeabi-v7a APP_PLATFORM=android-26 "$@"
          }
          dry_v7a NDK_DEBUG=0 > dry_v7a_release.txt 2>&1 || dump_and_die dry_v7a_release.txt
          if grep -q "tribal_bridge_c" dry_v7a_release.txt; then
            echo "FATAL: debug-only variant c exists in the armeabi-v7a release parse"
            dump_and_die dry_v7a_release.txt
          fi
          for m in libtribal_bridge_a.so libtribal_bridge_b.so libhev-socks5-tunnel.so; do
            grep -q "$m" dry_v7a_release.txt || {
              echo "FATAL: $m missing from the armeabi-v7a release parse"
              dump_and_die dry_v7a_release.txt
            }
          done
          echo "GATE PASSED: release = a + b (b carries norelro), no c; diagnostic = a+b+c; armeabi-v7a release = a+b+hev"

      - name: "Build + unit tests (ndk-build bridge variants a/b/c, VpnConfig/SOCKS5/Xray JVM tests)"
        run: gradle :app:assembleDebug :app:testDebugUnitTest

      - name: "Verify APK ABI contents (gate: arm64-v8a + armeabi-v7a only)"
        # Exactly the two retained ABIs must ship, for BOTH native components:
        # the local hev relay + bridge variants (ndk-build) and the pinned Xray
        # core (gomobile writes jni/<abi>/libgojni.so - verified in gomobile's
        # cmd/gomobile/bind_androidapp.go). Without this gate a dropped ABI
        # would only show up as an on-device UnsatisfiedLinkError, so the build
        # fails loudly instead. The packaged list is printed either way.
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -name '*.apk' | head -n1)"
          echo "APK: $APK"
          unzip -Z1 "$APK" | grep '^lib/' | sort > apk_libs.txt || true
          echo "=== packaged native libraries ==="
          cat apk_libs.txt
          fail=0
          for abi in arm64-v8a armeabi-v7a; do
            for so in libhev-socks5-tunnel.so libgojni.so \
                      libtribal_bridge_a.so libtribal_bridge_b.so; do
              if grep -qx "lib/$abi/$so" apk_libs.txt; then
                echo "OK      lib/$abi/$so"
              else
                echo "MISSING lib/$abi/$so"
                fail=1
              fi
            done
          done
          if grep -Eq '^lib/(x86|x86_64)/' apk_libs.txt; then
            echo "FATAL: unshipped ABIs are packaged:"
            grep -E '^lib/(x86|x86_64)/' apk_libs.txt
            fail=1
          else
            echo "OK      no x86/x86_64 native libraries packaged"
          fi
          if [ "$fail" -ne 0 ]; then
            echo "APK ABI GATE FAILED (see MISSING/FATAL lines above)"
            exit 1
          fi
          echo "APK ABI GATE PASSED: arm64-v8a + armeabi-v7a only, both components present"

      - name: Report native ELF segments + APK lib compression
        # Diagnostic only: it must never block the APK artifact from
        # uploading, so failures here (path misses, grep no-match) are ignored.
        if: always()
        continue-on-error: true
        run: |
          # NB: the linux-x86_64 below is the NDK's HOST toolchain directory
          # (the runner is x86_64 Linux) - it is not a target ABI. The packaged
          # target ABIs are arm64-v8a + armeabi-v7a, asserted by the ABI gate.
          READELF="$(ls -d "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf 2>/dev/null | head -n1)"
          echo "readelf: ${READELF:-NOT FOUND}"
          find app/build -type f -name '*.so' \
            \( -path '*arm64-v8a*' -o -path '*armeabi-v7a*' \) | sort -u | while read -r so; do
            echo "=== $so ==="
            if [ -n "$READELF" ]; then
              "$READELF" -lW "$so" | grep -E 'LOAD|GNU_RELRO' || echo '(no LOAD/RELRO lines)'
            else
              echo '(readelf not found)'
            fi
          done
          APK="$(find app/build/outputs -name '*.apk' | head -n1)"
          echo "=== lib entries in $APK (Stored = uncompressed/page-aligned) ==="
          unzip -v "$APK" 2>/dev/null | grep 'lib/' || echo '(no lib entries found)'

      - name: Upload APK
        # always(): a failing unit test turns the run red but must not stop
        # the device-test APK from being available.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tribal-vpn-debug-apk
          path: tribal-vpn/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
