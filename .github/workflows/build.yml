name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tribal-vpn
    steps:
      - name: Checkout (hev-socks5-tunnel submodule is cloned here, not on the phone)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: "Gate: ndk-build module-graph dry-runs (release-parity + diagnostic)"
        # Runs BEFORE Gradle, after checkout (it needs the hev submodule
        # sources to parse). Standalone ndk-build dry-runs validate the
        # module graph for both configurations and hard-fail if the
        # release-parity parse ever contains norelro or a debug-only
        # variant. NDK 26.1.10909125 is AGP 8.5.1's default - installing
        # it here also pre-warms Gradle's own auto-install.
        run: |
          NDKBUILD="$(ls -d "$ANDROID_HOME"/ndk/*/ndk-build 2>/dev/null | head -n1 || true)"
          if [ -z "$NDKBUILD" ]; then
            yes | sdkmanager "ndk;26.1.10909125" >/dev/null
            NDKBUILD="$(ls -d "$ANDROID_HOME"/ndk/*/ndk-build | head -n1)"
          fi
          echo "ndk-build: $NDKBUILD"
          cd app/src/main/cpp
          dry() {
            "$NDKBUILD" -n NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
              APP_ABI=arm64-v8a APP_PLATFORM=android-26 "$@"
          }
          dump_and_die() {
            echo "=== Android.mk ==="
            cat Android.mk
            echo "=== dry-run output ($1) ==="
            cat "$1"
            exit 1
          }
          dry NDK_DEBUG=0 > dry_release.txt 2>&1 || dump_and_die dry_release.txt
          if grep -q norelro dry_release.txt; then
            echo "FATAL: -Wl,-z,norelro reached the release-parity parse"
            dump_and_die dry_release.txt
          fi
          if grep -q tribal_bridge_b dry_release.txt || grep -q tribal_bridge_c dry_release.txt; then
            echo "FATAL: a debug-only variant exists in the release-parity parse"
            dump_and_die dry_release.txt
          fi
          grep -q libtribal_bridge_a.so dry_release.txt || {
            echo "FATAL: variant a missing from the release-parity parse"
            dump_and_die dry_release.txt
          }
          grep -q libhev-socks5-tunnel.so dry_release.txt || {
            echo "FATAL: hev-socks5-tunnel module missing (submodule checkout?)"
            dump_and_die dry_release.txt
          }
          dry NDK_DEBUG=0 TRIBAL_DIAG_VARIANTS=1 > dry_debug.txt 2>&1 || dump_and_die dry_debug.txt
          if ! grep -q tribal_bridge_b dry_debug.txt || ! grep -q tribal_bridge_c dry_debug.txt; then
            echo "FATAL: b/c missing from the diagnostic parse"
            dump_and_die dry_debug.txt
          fi
          dry NDK_DEBUG=1 > dry_ndkdebug.txt 2>&1 || dump_and_die dry_ndkdebug.txt
          echo "GATE PASSED: release parse = variant a only (no norelro); diagnostic parse = a+b+c"

      - name: "Build + unit tests (ndk-build bridge variants a/b/c, VpnConfig/SOCKS5 JVM tests)"
        run: gradle :app:assembleDebug :app:testDebugUnitTest

      - name: Report native ELF segments + APK lib compression
        # Diagnostic only: it must never block the APK artifact from
        # uploading, so failures here (path misses, grep no-match) are ignored.
        if: always()
        continue-on-error: true
        run: |
          READELF="$(ls -d "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf 2>/dev/null | head -n1)"
          echo "readelf: ${READELF:-NOT FOUND}"
          find app/build -type f -name '*.so' -path '*arm64-v8a*' | sort -u | while read -r so; do
            echo "=== $so ==="
            if [ -n "$READELF" ]; then
              "$READELF" -lW "$so" | grep -E 'LOAD|GNU_RELRO' || echo '(no LOAD/RELRO lines)'
            else
              echo '(readelf not found)'
            fi
          done
          APK="$(find app/build/outputs -name '*.apk' | head -n1)"
          echo "=== lib entries in $APK (Stored = uncompressed/page-aligned) ==="
          unzip -v "$APK" 2>/dev/null | grep 'lib/' || echo '(no lib entries found)'

      - name: Upload APK
        # always(): a failing unit test turns the run red but must not stop
        # the device-test APK from being available.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tribal-vpn-debug-apk
          path: tribal-vpn/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
