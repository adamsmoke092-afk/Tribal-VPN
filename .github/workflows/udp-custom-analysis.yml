name: UDP Custom protocol analysis

# Static protocol discovery - PHASE 1B (resilience fix revision).
#
# This workflow NEVER executes the downloaded TARGET binary. The analyzer
# (GoReSym, pinned to an immutable release with a verified SHA-256) is the
# only program that runs, and it only READS the target. The target binary
# itself is never uploaded as an artifact - only derived text evidence.
#
# Error-handling contract (this revision):
#   - GitHub Actions runs steps with an implicit "bash -e". Analyzer
#     failures are EXPECTED outcomes, so the GoReSym logic lives in
#     scripts/goresym-recovery.sh - a separate bash process that never
#     fails on analyzer errors, preserves every diagnostic (exit codes,
#     stdout of both attempts, stderr, carved version, jq outcomes), and
#     records RECOVERED vs NO-METADATA in analysis-status.txt.
#   - Infrastructure and integrity failures (download, digest mismatch,
#     missing analyzer) still fail the run loudly.
#   - Upload steps use "if: !cancelled()" so evidence collected before any
#     unexpected failure is still preserved.
#   - The "selftest" job proves with a mock analyzer (exit 1 + JSON error
#     object) that a failing analyzer cannot kill recovery and its
#     diagnostics survive into the outputs.
#
# Pins (verified 2026-10-22):
#   target   http-custom/udp-custom @ fcf839259e623af001cfa85fe1e1e343c58df264
#   binary   bin/udp-custom-linux-amd64
#            sha256 2a1b5584c7947feb5a02e847e09795751024f63ce7137a353c2b9c2a4282d636
#   analyzer GoReSym v3.4.1
#            sha256 a557124857f95a589f8ce3525119c2d18c7c7fc7c4225c92ff94e3effb38748d
#   siblings http-custom/udp        @ ccd5ffec4484b191478cf094b128a3268ff3beda
#            http-custom/udphc      @ 9e5333fd6b2b2390c6396a90ab487d3ce5e29b65
#            http-custom/udpcustom  @ 5f0443c2f9374fcc5350d6e495ecd27074c527e3
#            http-custom/udp_custom @ a9b0a06269618a9183dcf9ea367164755b0fe2c2
#
# Strings and recovered symbols are LEADS, not proof of the wire protocol.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Upstream owner/repo to analyze"
        required: false
        default: "http-custom/udp-custom"
      ref:
        description: "Immutable commit SHA of that repo (change together with repo)"
        required: false
        default: "fcf839259e623af001cfa85fe1e1e343c58df264"
      binary_path:
        description: "Path to the server binary inside that repo"
        required: false
        default: "bin/udp-custom-linux-amd64"
      expected_sha256:
        description: "Verified target SHA-256; empty = record-only (no verify)"
        required: false
        default: "2a1b5584c7947feb5a02e847e09795751024f63ce7137a353c2b9c2a4282d636"
      disassemble:
        description: "Optional comma-separated Go symbol regexes to disassemble"
        required: false
        default: ""
      analyze_siblings:
        description: "Also inventory the four sibling UDP repos at their pinned SHAs"
        required: false
        default: true
        type: boolean

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mock-analyzer resilience test (analyzer exit 1 must not kill recovery)
        run: |
          set -euo pipefail
          mkdir -p selftest
          printf 'not-a-real-binary but it contains a go1.99.9 marker\n' > selftest/mock-target.bin
          cat > selftest/mock-analyzer.sh <<'EOF'
          #!/usr/bin/env bash
          echo '{"error":"mock analyzer failure"}'
          echo "mock-analyzer: simulated parsing failure" >&2
          exit 1
          EOF
          chmod +x selftest/mock-analyzer.sh
          bash scripts/goresym-recovery.sh \
            "$PWD/selftest/mock-analyzer.sh" \
            "$PWD/selftest/mock-target.bin" \
            "$PWD/selftest/out"
          echo "--- analysis-status:";  cat selftest/out/analysis-status.txt
          echo "--- exit codes:";       cat selftest/out/goresym-exit-codes.txt
          echo "--- attempt1 stdout:";  cat selftest/out/goresym-attempt1-stdout.json
          echo "--- stderr:";           cat selftest/out/goresym-stderr.txt
          grep -q 'NO-METADATA'     selftest/out/analysis-status.txt
          grep -q 'orig_rc=1'       selftest/out/goresym-exit-codes.txt
          grep -q 'retry_rc=1'      selftest/out/goresym-exit-codes.txt
          grep -q 'go1.99.9'        selftest/out/goresym-version-carve.txt
          grep -q 'mock analyzer failure'      selftest/out/goresym-attempt1-stdout.json
          grep -q 'simulated parsing failure'  selftest/out/goresym-stderr.txt
          echo "SELFTEST PASSED: analyzer exit 1 preserved, recovery continued, evidence intact"

      - name: Mock unstrip resilience test (nonzero analyzer exits must not kill the step)
        run: |
          set -euo pipefail
          cat > selftest/mock-unstrip.sh <<'EOF'
          #!/usr/bin/env bash
          case "$*" in
            *--help*)
              echo "mock unstrip help"
              echo "  --info       container info"
              echo "  --buildinfo  build metadata"
              echo "  --capabilities capability report"
              echo "  --detect-garble garble verdict"
              exit 0
              ;;
            *)
              echo "mock-unstrip: simulated parse failure" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x selftest/mock-unstrip.sh
          bash scripts/unstrip-analysis.sh \
            "$PWD/selftest/mock-unstrip.sh" \
            "$PWD/selftest/mock-target.bin" \
            "$PWD/selftest/unstrip-out" || {
            echo "FAIL: unstrip-analysis.sh exited nonzero on analyzer failures"; exit 1; }
          echo "--- exit codes:"; cat selftest/unstrip-out/exit-codes-summary.txt
          echo "--- garble:";     cat selftest/unstrip-out/unstrip-garble-interpretation.txt
          grep -q 'functions|rc=1'    selftest/unstrip-out/exit-codes-summary.txt
          grep -q 'info|rc=1'         selftest/unstrip-out/exit-codes-summary.txt
          grep -q 'CLEAN'             selftest/unstrip-out/unstrip-garble-interpretation.txt
          grep -q 'simulated parse failure' selftest/unstrip-out/unstrip-functions.stderr.txt
          grep -q -- '--detect-garble' selftest/unstrip-out/unstrip-help.txt
          echo "SELFTEST PASSED (unstrip): nonzero exits preserved, garble semantics applied"

  analyze:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain context
        run: |
          uname -a
          go version
          jq --version
          command -v sha256sum file strings readelf objdump nm unzip

      - name: Download pinned upstream artifacts
        env:
          UPSTREAM_REPO: ${{ inputs.repo }}
          UPSTREAM_REF: ${{ inputs.ref }}
          UPSTREAM_BIN: ${{ inputs.binary_path }}
        run: |
          set -euo pipefail
          mkdir -p evidence/bin evidence/config
          base="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_REF}"
          echo "Analyzing ${UPSTREAM_REPO} @ ${UPSTREAM_REF} (${UPSTREAM_BIN})"
          curl -fsSL "$base/$UPSTREAM_BIN" -o evidence/bin/target-binary
          curl -fsSL "$base/config/config.json" -o evidence/config/config.json || true
          curl -fsSL "$base/config/udp-custom.service" -o evidence/config/udp-custom.service || true
          curl -fsSL "$base/config/udpgw.service" -o evidence/config/udpgw.service || true
          curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}" -o evidence/upstream-commit.json
          echo "(no disassembly requested)" > evidence/disasm.txt

      - name: Identity and SHA-256 verification
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          cd evidence
          actual=$(sha256sum bin/target-binary | awk '{print $1}')
          echo "$actual  bin/target-binary" | tee sha256.txt
          file bin/target-binary | tee file.txt
          readelf -h bin/target-binary > elf-header.txt 2>&1 || true
          readelf -S bin/target-binary > elf-sections.txt 2>&1 || true
          echo "expected=$EXPECTED_SHA actual=$actual"
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$actual" ]; then
            echo "::error::Target SHA-256 mismatch - refusing to analyze a different binary than the pinned one"
            exit 1
          fi
          echo "SHA-256 VERIFIED against pin" | tee -a sha256.txt

      - name: Go buildinfo attempt (recorded, may fail on stripped binaries)
        run: |
          cd evidence
          if go version -m bin/target-binary > go-buildinfo.txt 2>&1; then
            :
          else
            echo "(go version -m failed - buildinfo stripped or absent)" > go-buildinfo.txt
          fi

      - name: GoReSym metadata recovery (analyzer runs, target is only read)
        env:
          GORESYM_URL: https://github.com/mandiant/GoReSym/releases/download/v3.4.1/GoReSym-linux.zip
          GORESYM_SHA256: a557124857f95a589f8ce3525119c2d18c7c7fc7c4225c92ff94e3effb38748d
        run: |
          set -euo pipefail
          cd evidence
          curl -fsSL "$GORESYM_URL" -o GoReSym-linux.zip
          echo "analyzer=GoReSym v3.4.1 sha256=$GORESYM_SHA256" > analyzer.txt
          if echo "$GORESYM_SHA256  GoReSym-linux.zip" | sha256sum -c - | tee -a analyzer.txt; then
            :
          else
            echo "::error::GoReSym archive digest mismatch"
            exit 1
          fi
          rm -rf goresym-bin && mkdir -p goresym-bin
          unzip -o GoReSym-linux.zip -d goresym-bin >/dev/null
          goresym_exe=$(find goresym-bin -maxdepth 2 -type f -iname 'GoReSym*' | head -n 1)
          if [ -z "$goresym_exe" ]; then
            echo "::error::GoReSym executable not found in archive"
            exit 1
          fi
          chmod +x "$goresym_exe"
          # Recovery logic lives in scripts/goresym-recovery.sh, a separate
          # bash process: the step's implicit -e cannot kill it on the
          # analyzer's EXPECTED failures. Only infrastructure problems
          # (missing analyzer, unreadable target) exit nonzero.
          bash "$GITHUB_WORKSPACE/scripts/goresym-recovery.sh" \
            "$PWD/$goresym_exe" "$PWD/bin/target-binary" "$PWD"
          echo "--- recovery outcome:"
          cat analysis-status.txt goresym-exit-codes.txt

      - name: Raw strings inventory (language evidence, independent of GoReSym)
        run: |
          cd evidence
          strings -n 8 bin/target-binary > strings.txt
          wc -l strings.txt
          if ! grep -aoE 'go1\.[0-9]+(\.[0-9]+)?' bin/target-binary \
              | sort | uniq -c | sort -rn | head -n 10 > go-version-carve.txt; then
            : > go-version-carve.txt
          fi

      - name: Findings summary (printed to the run log)
        run: |
          cd evidence
          cat > UNRESOLVED.txt <<'EOF'
          The following are NOT established by strings or symbols - each
          needs disassembly-level or traffic-level evidence:
          1. Transport of the client-facing listener on :36712 (TCP or UDP).
          2. Connection sequence and session establishment from the client.
          3. Authentication handshake: message format, credential encoding,
             and how the server provisions the passwords (config "mode":
             "passwords").
          4. Message framing and packet encoding of the client protocol.
          5. Failure behaviour: refused credentials, expired accounts,
             idle disconnects, keepalives.
          6. How the 1-65535 range routes traffic to the core, per stack
             generation.
          7. Which stack generation the user's provider actually runs
             (2023 udp-custom vs the 2024 sibling repos).
          EOF
          {
            echo "=== UPSTREAM PIN ==="
            grep -m1 '"sha"' upstream-commit.json || true
            echo "=== TARGET SHA-256 (verified against pin) ==="
            cat sha256.txt
            echo "=== FILE TYPE / ARCH ==="
            cat file.txt
            echo "=== ANALYZER ==="
            cat analyzer.txt
            echo "=== ANALYSIS STATUS (RECOVERED / NO-METADATA) ==="
            cat analysis-status.txt
            cat goresym-exit-codes.txt
            echo "=== GoReSym DIAGNOSTIC OUTPUT (stderr, first 60 lines) ==="
            head -n 60 goresym-stderr.txt 2>/dev/null || true
            echo "=== JSON PARSE STATUS ==="
            cat json-parse-status.txt 2>/dev/null || true
            echo "=== GoReSym SUMMARY (Version/BuildId/Arch) ==="
            cat goresym-summary.txt 2>/dev/null || echo "(none)"
            echo "=== GO VERSION CARVE (raw bytes, independent evidence) ==="
            cat go-version-carve.txt 2>/dev/null || echo "(no go1.x strings)"
            echo "=== GO BUILDINFO ATTEMPT ==="
            cat go-buildinfo.txt
            echo "=== RECOVERED USER FUNCTIONS (count + first 80) ==="
            wc -l user-functions.txt 2>/dev/null || echo "0 user-functions.txt"
            head -n 80 user-functions.txt 2>/dev/null || true
            echo "=== NET / AUTH / FRAMING CANDIDATE FUNCTIONS (with addresses) ==="
            grep -iE 'listen|dial|serve|udp|packet|auth|password|session|handle|handshake|frame|conn|nat|redirect' \
              user-functions.txt 2>/dev/null | head -n 120 || echo "(no user functions recovered)"
            echo "=== EMBEDDED SOURCE PATHS (first 40) ==="
            head -n 40 goresym-files.txt 2>/dev/null || true
            grep -E '\.go$|/app/cmd/|/udp-custom/' strings.txt | head -n 40 || true
            echo "=== PROTOCOL-RELEVANT STRINGS (first 150 hits) ==="
            grep -inE 'password|auth|login|token|handshake|listen|36712|7800|7300|udpgw|socks|nat|redirect|exclude|range|keepalive|session|framing|packet|payload|encrypt|obfs|udp' strings.txt | head -n 150 || true
            echo "=== UNRESOLVED PROTOCOL QUESTIONS ==="
            cat UNRESOLVED.txt
          } | tee FINDINGS.txt

      - name: Optional targeted disassembly
        if: ${{ inputs.disassemble != '' }}
        env:
          SYMS_INPUT: ${{ inputs.disassemble }}
        run: |
          cd evidence
          : > disasm.txt
          IFS=',' read -ra SYMS <<< "$SYMS_INPUT"
          for s in "${SYMS[@]}"; do
            [ -z "$s" ] && continue
            echo "=== objdump -s '$s' ===" >> disasm.txt
            if go tool objdump -s "$s" bin/target-binary >> disasm.txt 2>&1; then
              :
            else
              echo "(objdump failed for '$s')" >> disasm.txt
            fi
          done

      - name: Upload text evidence (never the target binary)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: udp-custom-analysis
          path: |
            evidence/FINDINGS.txt
            evidence/UNRESOLVED.txt
            evidence/sha256.txt
            evidence/file.txt
            evidence/elf-header.txt
            evidence/elf-sections.txt
            evidence/analyzer.txt
            evidence/go-buildinfo.txt
            evidence/go-version-carve.txt
            evidence/analysis-status.txt
            evidence/goresym-exit-codes.txt
            evidence/json-parse-status.txt
            evidence/goresym-full.json
            evidence/goresym-attempt1-stdout.json
            evidence/goresym-human.txt
            evidence/goresym-keys.txt
            evidence/goresym-summary.txt
            evidence/goresym-stderr.txt
            evidence/goresym-files.txt
            evidence/user-functions.txt
            evidence/std-functions.txt
            evidence/strings.txt
            evidence/disasm.txt
            evidence/upstream-commit.json
            evidence/config/
          if-no-files-found: error

  siblings:
    if: ${{ inputs.analyze_siblings }}
    runs-on: ubuntu-latest
    steps:
      - name: Inventory pinned sibling repos (metadata only, binaries hashed then deleted)
        run: |
          set -uo pipefail
          mkdir -p evidence/siblings
          analyze_repo() {
            local repo="$1" sha="$2"
            local dir="evidence/siblings/$repo"
            mkdir -p "$dir"
            echo "repo=$repo sha=$sha" | tee "$dir/PIN.txt"
            local files="$dir/filelist.tsv"
            : > "$files"
            for sub in "" "bin" "module" "config"; do
              local idx="${sub:-root}"
              local url="https://api.github.com/repos/http-custom/$repo/contents"
              if [ -n "$sub" ]; then url="$url/$sub"; fi
              if curl -fsSL "$url?ref=$sha" -o "$dir/contents-$idx.json" 2>/dev/null; then
                jq -r '.[]? | select(.type=="file") | "\(.path)\t\(.size)\t\(.download_url)"' \
                  "$dir/contents-$idx.json" >> "$files" 2>/dev/null || true
              fi
            done
            sort -u "$files" -o "$files" || true
            while IFS=$'\t' read -r path size url; do
              [ -z "${path:-}" ] && continue
              local safe
              safe=$(printf '%s' "$path" | tr '/' '_')
              if ! curl -fsSL "$url" -o "$dir/item_$safe"; then
                echo "download failed: $repo $path" >> "$dir/FAILED.txt"
                continue
              fi
              sha256sum "$dir/item_$safe" | sed "s# .*/# $repo/$path#" | tee -a "$dir/SHA256.txt"
              file -b "$dir/item_$safe" | sed "s#^#$repo/$path: #" | tee -a "$dir/FILE.txt"
              if [ "${size:-0}" -gt 500000 ]; then
                strings -n 8 "$dir/item_$safe" \
                  | grep -iE 'password|auth|handshake|listen|udpgw|socks|keepalive|frame|packet|session|go1\.[0-9]|36712|7800' \
                  | head -n 40 >> "$dir/BIG-STRINGS.txt" || true
                rm -f "$dir/item_$safe"
              fi
            done < "$files"
            return 0
          }
          analyze_repo udp        ccd5ffec4484b191478cf094b128a3268ff3beda
          analyze_repo udphc      9e5333fd6b2b2390c6396a90ab487d3ce5e29b65
          analyze_repo udpcustom  5f0443c2f9374fcc5350d6e495ecd27074c527e3
          analyze_repo udp_custom a9b0a06269618a9183dcf9ea367164755b0fe2c2

      - name: Sibling summary (printed to the run log)
        run: |
          cd evidence/siblings
          for d in */; do
            repo="${d%/}"
            echo "=== $repo ==="
            cat "$d/PIN.txt" 2>/dev/null || true
            echo "-- files listed: $(wc -l < "$d/filelist.tsv" 2>/dev/null || echo 0)"
            echo "-- executables/architectures:"
            grep -E 'ELF|Mach|PE32|executable' "$d/FILE.txt" 2>/dev/null | head -n 8 || echo "   (none)"
            echo "-- protocol-relevant strings from big files:"
            head -n 20 "$d/BIG-STRINGS.txt" 2>/dev/null || echo "   (none)"
          done | tee ../SIBLINGS-FINDINGS.txt

      - name: Upload sibling text evidence (binaries were deleted, never uploaded)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: udp-custom-siblings
          path: evidence/siblings/
          if-no-files-found: error

  phase2-unstrip:
    # Independent parser for the pclntab question: GoReSym reported
    # "no valid pclntab found"; unstrip (riven-labs, Rust) uses a
    # different recovery strategy (magic-byte scan fallback for stripped,
    # section-less ELFs) and supports Go 1.18-1.25, including
    # garble-obfuscated binaries. Static analysis only - the target is
    # never executed, and Phase 1 evidence is untouched.
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned target and enforce SHA-256 (identity before analysis)
        env:
          UPSTREAM_REPO: ${{ inputs.repo }}
          UPSTREAM_REF: ${{ inputs.ref }}
          UPSTREAM_BIN: ${{ inputs.binary_path }}
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p phase2
          curl -fsSL "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_REF}/${UPSTREAM_BIN}" \
            -o phase2/target-binary
          cd phase2
          actual=$(sha256sum target-binary | awk '{print $1}')
          {
            echo "repo=${UPSTREAM_REPO}"
            echo "ref=${UPSTREAM_REF}"
            echo "binary_path=${UPSTREAM_BIN}"
            echo "expected_sha256=${EXPECTED_SHA}"
            echo "actual_sha256=${actual}"
          } > target-sha256.txt
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$actual" ]; then
            echo "verdict=MISMATCH - analysis refused" >> target-sha256.txt
            echo "::error::Target SHA-256 mismatch - refusing to analyze"
            exit 1
          fi
          echo "verdict=MATCH - verified against the pinned SHA-256 before any analysis" >> target-sha256.txt
          cat target-sha256.txt

      - name: Acquire pinned unstrip v1.2.0 (dual digest verification)
        env:
          UNSTRIP_TARBALL: unstrip-v1.2.0-x86_64-unknown-linux-gnu.tar.gz
          UNSTRIP_URL: https://github.com/riven-labs/unstrip/releases/download/v1.2.0/unstrip-v1.2.0-x86_64-unknown-linux-gnu.tar.gz
          UNSTRIP_SHA256: a6268afce24e6abdbd8172d5a61174e198864d997c1cd70cc5e002c055d92667
          UNSTRIP_SUMS_URL: https://github.com/riven-labs/unstrip/releases/download/v1.2.0/SHA256SUMS
        run: |
          set -euo pipefail
          cd phase2
          curl -fsSL "$UNSTRIP_URL" -o "$UNSTRIP_TARBALL"
          {
            echo "tool=riven-labs/unstrip"
            echo "release=v1.2.0"
            echo "asset=$UNSTRIP_TARBALL"
            echo "source_identifier=github.com/riven-labs/unstrip release v1.2.0"
            echo "verification=github release API digest + release SHA256SUMS + local sha256sum"
          } > tool-version.txt
          {
            echo "# source 1: GitHub release API digest"
            if echo "$UNSTRIP_SHA256  $UNSTRIP_TARBALL" | sha256sum -c -; then
              echo "api_digest=VERIFIED"
            else
              echo "api_digest=MISMATCH"
              echo "::error::unstrip archive digest mismatch (release API)"
              exit 1
            fi
            echo "# source 2: the release's own SHA256SUMS file"
            if curl -fsSL "$UNSTRIP_SUMS_URL" -o SHA256SUMS &&
               grep " $UNSTRIP_TARBALL\$" SHA256SUMS > sums-line.txt &&
               sha256sum -c sums-line.txt; then
              echo "sha256sums_file=VERIFIED"
            else
              echo "sha256sums_file=NOT-VERIFIABLE (recorded; the API digest was already enforced)"
            fi
          } > tool-sha256.txt
          tar -tzf "$UNSTRIP_TARBALL" > tool-contents.txt
          mkdir -p tool
          tar -xzf "$UNSTRIP_TARBALL" -C tool
          unstrip_exe=$(find tool -type f -name 'unstrip' | head -n 1)
          if [ -z "$unstrip_exe" ]; then
            echo "::error::unstrip executable not found in archive"
            cat tool-contents.txt
            exit 1
          fi
          chmod +x "$unstrip_exe"
          sha256sum "$unstrip_exe" | sed 's# .*/#  #' >> tool-sha256.txt
          echo "$PWD/$unstrip_exe" > unstrip-path.txt
          cat tool-version.txt tool-sha256.txt

      - name: unstrip static analysis (help-first, exit-code safe)
        run: |
          set -euo pipefail
          cd phase2
          exe=$(cat unstrip-path.txt)
          bash "$GITHUB_WORKSPACE/scripts/unstrip-analysis.sh" "$exe" "$PWD/target-binary" "$PWD"
          echo "--- exit codes:";  cat exit-codes-summary.txt
          echo "--- garble:";      cat unstrip-garble-interpretation.txt

      - name: ELF inspection (actual outputs preserved)
        run: |
          set -euo pipefail
          cd phase2
          file target-binary > file.txt
          readelf -h -l -S target-binary > readelf.txt 2>&1 || true
          objdump -f target-binary > objdump-file-format.txt 2>&1 || true

      - name: Function candidates (metadata leads only)
        run: |
          set -euo pipefail
          cd phase2
          {
            echo "# Candidate functions - LEADS ONLY. Recovered names and"
            echo "# addresses are parser-reported metadata, not proof of behavior."
            if [ -s unstrip-functions.txt ]; then
              echo "# recovered listing lines: $(wc -l < unstrip-functions.txt)"
              grep -inE 'net|udp|tcp|ssh|auth|passw|login|token|encrypt|decrypt|crypto|tls|packet|socket|conn|session|listen|dial|proxy|tunnel|dns|config|parse|frame' \
                unstrip-functions.txt | head -n 200 || true
            else
              echo "# NO FUNCTIONS RECOVERED - candidates are not derivable from metadata."
              echo "# See unstrip-functions.stderr.txt for the tool's exact diagnostic."
            fi
          } > function-candidates.txt
          cat function-candidates.txt

      - name: PHASE2_REPORT.md assembly
        run: |
          set -euo pipefail
          cd phase2
          cat > UNRESOLVED-PHASE2.txt <<'EOF'
          Standing protocol questions (unchanged from Phase 1):
            1. Transport of the client-facing listener on :36712 (TCP or UDP).
            2. Connection sequence and session establishment from the client.
            3. Authentication handshake and credential encoding.
            4. Message framing and packet encoding.
            5. Failure behaviour (bad credentials, expiry, idle, keepalives).
            6. How the 1-65535 range routes traffic to the core.
            7. Which stack generation the user's provider runs.
          Next-blocker branches:
            A. If unstrip recovered functions: next = targeted review and
               disassembly of candidates (addresses above), then translate
               findings into the protocol questions.
            B. If no pclntab and no functions again: the Go-metadata route is
               exhausted. Program headers ARE present (readelf.txt), so raw
               executable-segment disassembly is technically feasible but
               yields unlabeled assembly. The strongest remaining route to
               the wire protocol is a packet capture of HTTP Custom's own
               UDP traffic from the device.
          EOF
          {
            echo "# Phase 2 report - unstrip static analysis"
            echo
            echo "## Target integrity"
            cat target-sha256.txt
            echo
            echo "## Tool"
            cat tool-version.txt
            echo
            cat tool-sha256.txt
            echo
            echo "## Invocations (name|rc|args)"
            cat exit-codes-summary.txt
            echo
            echo "## Garble verdict"
            cat unstrip-garble-interpretation.txt
            echo
            echo "## Function recovery"
            if [ -s unstrip-functions.txt ]; then
              echo "recovered listing lines: $(wc -l < unstrip-functions.txt)"
              head -n 15 unstrip-functions.txt
            else
              echo "NO FUNCTIONS RECOVERED - see unstrip-functions.stderr.txt"
            fi
            echo
            echo "## ELF"
            cat file.txt
            grep -m1 -E 'Entry point|Machine' readelf.txt || true
            echo
            echo "## Networking leads"
            head -n 40 function-candidates.txt
            echo
            echo "## Next blocker"
            cat UNRESOLVED-PHASE2.txt
          } > PHASE2_REPORT.md
          head -n 80 PHASE2_REPORT.md

      - name: Upload Phase 2 evidence (text only - never the target binary or the tool)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: udp-custom-phase2
          path: |
            phase2/**
            !phase2/target-binary
            !phase2/unstrip-v1.2.0-x86_64-unknown-linux-gnu.tar.gz
            !phase2/tool/**
          if-no-files-found: error
