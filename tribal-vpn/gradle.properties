# Required for AndroidX/Compose dependencies (the build fails without it)
android.useAndroidX=true

# No legacy support-library dependencies in this app (sshj, kotlinx only),
# so the jetifier isn't needed
android.enableJetifier=false

# CI-friendly JVM heap for Gradle + Kotlin/Compose compilation
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
